[package]
name = "code-mechanic"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "AST-indexed structural retrieval and guarded mechanical refactors for coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shipsoftwareai/code-mechanic"
homepage = "https://github.com/shipsoftwareai/code-mechanic"
documentation = "https://github.com/shipsoftwareai/code-mechanic/tree/main/docs"
readme = "README.md"
keywords = ["ast", "refactoring", "agents", "tree-sitter", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "tests/**",
    "fixtures/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
]

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
dirs = "6.0"
ignore = "0.4"
notify = "8.2"
regex = "1.12"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiktoken-rs = "0.12"
tree-sitter = "0.26"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23.4"
tree-sitter-glsl = "0.2.0"
tree-sitter-go = "0.25.0"
tree-sitter-objc = "3.0.2"
tree-sitter-rust = "0.24"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
