<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Code Mechanic</title>
  <desc id="desc">Balanced cyan code chevrons surrounding an amber mechanical gear</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <rect id="tooth" x="60" y="37" width="8" height="12" rx="2"/>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" stroke="#334155" stroke-width="4"/>
  <path d="M34 40 17 64l17 24M94 40l17 24-17 24" fill="none" stroke="url(#cyan)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="url(#gear)">
    <use href="#tooth"/>
    <use href="#tooth" transform="rotate(45 64 64)"/>
    <use href="#tooth" transform="rotate(90 64 64)"/>
    <use href="#tooth" transform="rotate(135 64 64)"/>
    <use href="#tooth" transform="rotate(180 64 64)"/>
    <use href="#tooth" transform="rotate(225 64 64)"/>
    <use href="#tooth" transform="rotate(270 64 64)"/>
    <use href="#tooth" transform="rotate(315 64 64)"/>
    <circle cx="64" cy="64" r="20"/>
    <circle cx="64" cy="64" r="8.5" fill="#17243a"/>
    <circle cx="64" cy="64" r="3.5" fill="#fbbf24"/>
  </g>
</svg>
