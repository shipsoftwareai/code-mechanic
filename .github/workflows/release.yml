name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: code-mechanic-linux-x86_64.tar.gz
            binary: code-mechanic
          - os: macos-15
            target: aarch64-apple-darwin
            archive: code-mechanic-macos-aarch64.tar.gz
            binary: code-mechanic
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: code-mechanic-macos-x86_64.tar.gz
            binary: code-mechanic
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: code-mechanic-windows-x86_64.zip
            binary: code-mechanic.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/package/
          tar -C dist/package -czf "dist/${{ matrix.archive }}" .
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/package/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/${{ matrix.archive }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        working-directory: dist
        run: sha256sum code-mechanic-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*
